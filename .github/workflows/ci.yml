name: GenomicsSentinel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── 1. Lint & validate config ─────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          pip install snakemake pyyaml yamllint ruff

      - name: Lint Python scripts
        run: ruff check scripts/

      - name: Validate YAML config
        run: |
          python -c "
          import yaml
          with open('config/config.yaml') as f:
            cfg = yaml.safe_load(f)
          assert 'samples' in cfg
          assert 'genome' in cfg
          print('✓ Config valid')
          "

      - name: Snakemake dry-run
        run: |
          snakemake --dry-run --cores 1 \
            --config configfile=config/config.yaml \
            2>&1 | tail -20

  # ── 2. Test ML scripts ────────────────────────────────
  test-ml:
    name: Test ML Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn xgboost shap optuna mlflow pytest

      - name: Run ML unit tests
        run: pytest tests/test_ml.py -v

  # ── 3. Test R scripts ─────────────────────────────────
  test-r:
    name: Test R Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Install R packages
        run: |
          Rscript -e "
          install.packages(c('testthat', 'yaml', 'dplyr', 'ggplot2'), repos='https://cran.r-project.org')
          "

      - name: Run R tests
        run: Rscript -e "testthat::test_dir('tests/r/')"

  # ── 4. Build & push Docker images ────────────────────
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-ml, test-r]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pipeline image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.pipeline
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/pipeline:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/pipeline:${{ github.sha }}

      - name: Build jupyter image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.jupyter
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/jupyter:latest

  # ── 5. Generate badge ─────────────────────────────────
  badge:
    name: Update README badge
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Update pipeline status badge
        run: echo "Pipeline CI passed ✓"
